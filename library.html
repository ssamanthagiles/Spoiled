<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spoiled Library</title>
  <link rel="stylesheet" href="library.css" />
</head>

<body>
  <main class="library-page">

    <header class="library-topbar">
      <a href="index.html" class="logo-link">
        <img src="spoiled-logo.png" alt="Spoiled logo" />
      </a>

      <a href="index.html" class="back-link">← Leave the Library </a>
    </header>

    <section class="library-hero">
      <p class="small-label">The Spoiled Library</p>

      <h1>Choose how spoiled you want to be.</h1>

      <p>
        Browse the library, pick a story, and decide how much you want to spoil.
        <br>
        A hint, a partial spoiler, a character fate, or the full spoiler.
      </p>
    </section>

    <section class="search-section">
      <input
        type="text"
        id="searchInput"
        placeholder="Search by title, author, genre, or tag."
      />

    </section>

    <section class="book-grid" id="bookGrid"></section>

  </main>

  <script src="library.js"></script>
</body>
</html>
